<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="作業報告書">
<meta name="theme-color" content="#23463A">
<title>作業報告書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --board:#23463A; --board-ink:#EEF3EF; --board-dim:#A9C2B6;
  --paper:#E8ECE9; --surface:#FFFFFF; --ink:#18211D; --sub:#5A6862; --line:#C7D0CB;
  --yellow:#F5C400; --yellow-ink:#1C1A0E; --alert:#C0392B; --ok:#2E7D4F; --sheet:#FFFFFF;
  --focus:#1E6FD9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --board:#1A3329; --board-ink:#E6EEE9; --board-dim:#8FAA9C;
    --paper:#121614; --surface:#1C2320; --ink:#E7ECE9; --sub:#9AA8A1; --line:#34403A;
    --yellow:#F2C200; --yellow-ink:#1C1A0E; --alert:#FF6B5B; --ok:#5CC28A; --sheet:#FFFFFF; --focus:#6AA8FF;
  }
}
:root[data-theme="dark"]{
  --board:#1A3329; --board-ink:#E6EEE9; --board-dim:#8FAA9C;
  --paper:#121614; --surface:#1C2320; --ink:#E7ECE9; --sub:#9AA8A1; --line:#34403A;
  --yellow:#F2C200; --yellow-ink:#1C1A0E; --alert:#FF6B5B; --ok:#5CC28A; --sheet:#FFFFFF; --focus:#6AA8FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
  font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:0 14px 140px}

/* 黒板ヘッダー：入力内容がそのまま工事黒板のように表示される */
.board{background:var(--board);color:var(--board-ink);margin:0 -14px;padding:18px 20px 16px;
  border-bottom:6px solid #6B4F2A;position:relative}
.board h1{margin:0 0 10px;font-size:22px;letter-spacing:.35em;font-weight:700}
.board dl{display:grid;grid-template-columns:4.8em 1fr;gap:4px 10px;margin:0;font-size:15px}
.board dt{color:var(--board-dim)}
.board dd{margin:0;border-bottom:1px dashed rgba(238,243,239,.35);min-height:1.6em;overflow-wrap:anywhere}
.board dd.empty{color:rgba(238,243,239,.35)}
.saved{position:absolute;right:16px;top:20px;font-size:12px;color:var(--board-dim)}

section{margin-top:22px}
h2{font-size:17px;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
h2 small{font-weight:400;font-size:13px;color:var(--sub)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 14px}
.field{display:block;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field > span{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:4px}
.field .req{color:var(--alert)}
.field input,.field textarea{width:100%;border:0;background:transparent;font-size:17px;padding:4px 0;outline:none;resize:none;border-radius:4px}
.field input:focus-visible,.field textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.field textarea{min-height:5.2em;line-height:1.6}
.meter{font-variant-numeric:tabular-nums}
.meter.over{color:var(--alert);font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.row2 .field:last-child{border-bottom:1px solid var(--line)}

/* 写真追加 */
.adders{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adder{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  min-height:84px;border-radius:10px;border:2px solid var(--board);background:var(--surface);color:var(--board);font-weight:700;cursor:pointer}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .adder{color:var(--board-ink);border-color:var(--board-dim)}}
.adder svg{width:28px;height:28px}
.adder input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.adder:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.hint{font-size:13px;color:var(--sub);margin:10px 2px 0}
.progress{font-size:14px;margin-top:10px;color:var(--ok);min-height:1.4em}

/* 写真ページ：Excelの1ページ＝3枚と同じ区切りで表示 */
.page{margin-top:18px}
.page-label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:8px;margin:0 2px 8px}
.page-label::after{content:"";flex:1;border-top:1px solid var(--line)}
.photo{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.frame{position:relative;background:var(--sheet);aspect-ratio:476/356;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.frame img{max-width:calc(100% - 10px);max-height:calc(100% - 10px);object-fit:contain;display:block}
.no{position:absolute;left:0;top:0;background:var(--board);color:var(--board-ink);font-size:13px;font-weight:700;padding:3px 10px;border-bottom-right-radius:8px}
.photo .body{padding:10px 12px 12px}
.photo textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:transparent;padding:8px 10px;font-size:16px;min-height:2.9em;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px;min-height:34px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--board);color:var(--board-ink);border-color:var(--board)}
.tools{display:flex;gap:6px}
.tool{flex:1;min-height:44px;border:1px solid var(--line);border-radius:8px;background:transparent;display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;cursor:pointer}
.tool svg{width:20px;height:20px}
.tool:disabled{opacity:.35}
.tool.del{color:var(--alert)}
.first-hint{font-size:12px;color:var(--sub);margin:6px 0 0}
.empty{border:2px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;color:var(--sub);font-size:14px;margin-top:14px}

.reset{margin:30px auto 0;display:block;background:none;border:0;color:var(--sub);text-decoration:underline;font-size:14px;padding:10px;cursor:pointer}

/* 下部バー */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.bar .in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .sum{flex:1;font-size:13px;color:var(--sub);line-height:1.4}
.bar .sum b{color:var(--ink);font-size:15px}
.primary{min-height:52px;padding:0 22px;border:0;border-radius:10px;background:var(--yellow);color:var(--yellow-ink);font-weight:700;font-size:17px;cursor:pointer;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.primary:disabled{opacity:.5}
.errors{color:var(--alert);font-size:14px;margin:12px 2px 0;white-space:pre-line}

/* 完成シート */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:620px;border-radius:16px 16px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet p{margin:0 0 16px;color:var(--sub);font-size:14px;overflow-wrap:anywhere}
.sheet .primary{width:100%;margin-bottom:10px}
.ghost{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;background:transparent;font-size:16px;cursor:pointer;margin-bottom:10px}
.msg{font-size:14px;min-height:1.4em;margin:2px 0 8px}
@media (prefers-reduced-motion: no-preference){
  .sheet-bg.open .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="board" aria-label="報告書の概要">
    <h1>作業報告書</h1>
    <span class="saved" id="saved" aria-live="polite"></span>
    <dl>
      <dt>現場</dt><dd id="b-site" class="empty">未入力</dd>
      <dt>作業</dt><dd id="b-work" class="empty">未入力</dd>
      <dt>実施日</dt><dd id="b-date" class="empty">未入力</dd>
      <dt>写真</dt><dd id="b-photos">0枚</dd>
    </dl>
  </header>

  <section>
    <h2>現場と作業</h2>
    <div class="panel">
      <label class="field"><span>現場名称 <em class="req">必須</em></span><input id="site" autocomplete="off" enterkeyhint="next"></label>
      <label class="field"><span>所在地</span><input id="address" autocomplete="off" enterkeyhint="next"></label>
      <label class="field"><span>作業名 <em class="req">必須</em></span><input id="work" autocomplete="off" enterkeyhint="next"></label>
      <label class="field"><span>作業実施日 <em class="req">必須</em></span><input id="date" type="date"></label>
      <div class="row2">
        <label class="field"><span>作業責任者名</span><input id="leader" autocomplete="name" enterkeyhint="next"></label>
        <label class="field"><span>営業担当者</span><input id="sales" autocomplete="off" enterkeyhint="done"></label>
      </div>
    </div>
  </section>

  <section>
    <h2>経過及び所見</h2>
    <div class="panel">
      <label class="field"><span>作業内容<b class="meter" id="m-content"></b></span><textarea id="content" rows="4"></textarea></label>
      <label class="field"><span>写真</span><input id="photoNote" autocomplete="off"></label>
      <label class="field"><span>特記事項<b class="meter" id="m-notes"></b></span><textarea id="notes" rows="3"></textarea></label>
    </div>
  </section>

  <section>
    <h2>写真 <small>3枚で1ページ</small></h2>
    <div class="adders">
      <label class="adder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        撮影する
        <input id="cam" type="file" accept="image/*" capture="environment" aria-label="カメラで撮影する">
      </label>
      <label class="adder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
        写真から選ぶ
        <input id="lib" type="file" accept="image/*" multiple aria-label="写真ライブラリから選ぶ">
      </label>
    </div>
    <div class="progress" id="progress" aria-live="polite"></div>
    <div id="pages"></div>
  </section>

  <button class="reset" id="reset" type="button">新しい報告書を始める</button>
</div>

<div class="bar">
  <div class="in">
    <div class="sum" id="sum"><b>写真 0枚</b><br>表紙のみ</div>
    <button class="primary" id="make" type="button">Excelを作成</button>
  </div>
  <div class="errors" id="errors" role="alert" style="max-width:620px;margin:0 auto"></div>
</div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">Excelを作成しました</h3>
    <p id="sheetFile"></p>
    <div class="msg" id="sheetMsg" aria-live="polite"></div>
    <button class="primary" id="btnSave" type="button" hidden>iPhoneに保存</button>
    <button class="primary" id="btnShare" type="button" hidden>共有する（メール・LINE・ファイル）</button>
    <button class="ghost" id="btnDownload" type="button" hidden>ダウンロード</button>
    <button class="ghost" id="btnClose" type="button">閉じる</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ===== 作業報告書 Excel 生成コア（ブラウザ / Node 共通） =====
 * テンプレート（表紙＋写真ページ雛形）に値と写真を差し込み、.xlsx を組み立てる。
 * 画像は標準の描画オブジェクト（oneCellAnchor）で配置するため Excel 2007 以降すべてで同じ表示になる。
 */
var ReportCore = (function () {
  // ---- 写真枠の寸法（Excel / ＭＳ Ｐゴシック 11pt 基準・テンプレートの列幅と行高から算出）
  var EMU_PX = 9525;
  var MDW = 7; // 標準フォントの数字幅(px)
  function colPx(w) { return Math.floor(((256 * w + Math.floor(128 / MDW)) / 256) * MDW); }
  var BOX_COL0 = 1, BOX_COLS = 14, COL_W = colPx(4.875);      // B〜O列
  var ROW_PX = 18, LAST_ROW_PX = 14, BOX_ROWS = 20;            // 13.5pt×19行 + 10.5pt×1行
  var BOX_W = BOX_COLS * COL_W;
  var BOX_H = (BOX_ROWS - 1) * ROW_PX + LAST_ROW_PX;
  var MARGIN = 6;                                              // 枠線との余白(px)
  var PER_PAGE = 3;
  var BLOCK_ROW0 = [3, 23, 43];                                // 0始まりの行番号（4,24,44行目）
  var CAP_CELL = ['P7', 'P27', 'P47'], NO_CELL = ['P4', 'P24', 'P44'], SITE_CELL = ['P5', 'P25', 'P45'];

  // ---- 表紙の入力セル
  var CONTENT_ROWS = ['R25','R26','R27','R28','R29','R30','R31','R32','R33','R34','R35','R36'];
  var NOTE_ROWS = ['R42','B43','B44','B45','B46'];
  var NOTE_CAP = [26, 38, 38, 38, 38];
  var LINE_CAP = 26; // R〜AW列 12pt で全角26文字

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function charW(ch) { return /[\u0000-\u00ff\uff61-\uff9f]/.test(ch) ? 0.5 : 1; }
  // 改行＋文字幅で行に分割
  function wrapLines(text, cap) {
    var out = [];
    String(text || '').replace(/\r\n?/g, '\n').split('\n').forEach(function (para) {
      var line = '', w = 0;
      Array.from(para).forEach(function (ch) {
        var cw = charW(ch);
        if (w + cw > cap && line) { out.push(line); line = ''; w = 0; }
        line += ch; w += cw;
      });
      out.push(line);
    });
    while (out.length && out[out.length - 1] === '') out.pop();
    return out;
  }
  function wrapNotes(text) {
    // 1行目は R42（狭い）、2行目以降は B列から（広い）
    var paras = String(text || '').replace(/\r\n?/g, '\n').split('\n');
    var out = [], i = 0;
    paras.forEach(function (para) {
      var line = '', w = 0;
      Array.from(para).forEach(function (ch) {
        var cap = NOTE_CAP[Math.min(out.length, NOTE_CAP.length - 1)], cw = charW(ch);
        if (w + cw > cap && line) { out.push(line); line = ''; w = 0; }
        line += ch; w += cw;
      });
      out.push(line);
    });
    while (out.length && out[out.length - 1] === '') out.pop();
    return out;
  }

  function setCell(xml, ref, value, kind) {
    var re = new RegExp('<c r="' + ref + '"((?: [a-z]+="[^"]*")*?)(?:/>|>[\\s\\S]*?</c>)');
    var m = re.exec(xml);
    if (!m) throw new Error('テンプレートにセル ' + ref + ' がありません');
    var attrs = m[1].replace(/ t="[^"]*"/, '');
    var cell;
    if (value === '' || value == null) cell = '<c r="' + ref + '"' + attrs + '/>';
    else if (kind === 'num') cell = '<c r="' + ref + '"' + attrs + '><v>' + value + '</v></c>';
    else cell = '<c r="' + ref + '"' + attrs + ' t="inlineStr"><is><t xml:space="preserve">' + esc(value) + '</t></is></c>';
    return xml.slice(0, m.index) + cell + xml.slice(m.index + m[0].length);
  }

  function dateSerial(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    if (!m) return '';
    return (Date.UTC(+m[1], +m[2] - 1, +m[3]) - Date.UTC(1899, 11, 30)) / 86400000;
  }

  // 写真を枠内に収める位置とサイズ（px）
  function fitPhoto(w, h, block) {
    var aw = BOX_W - MARGIN * 2, ah = BOX_H - MARGIN * 2;
    var s = Math.min(aw / w, ah / h);
    var dw = Math.floor(w * s), dh = Math.floor(h * s);
    var x = Math.round((BOX_W - dw) / 2), y = Math.round((BOX_H - dh) / 2);
    var col = BOX_COL0 + Math.floor(x / COL_W), colOff = x % COL_W;
    var row = BLOCK_ROW0[block], acc = y;
    while (acc >= ROW_PX) { acc -= ROW_PX; row++; }
    return { col: col, colOff: colOff * EMU_PX, row: row, rowOff: acc * EMU_PX, cx: dw * EMU_PX, cy: dh * EMU_PX, dw: dw, dh: dh };
  }

  function drawingXml(items) {
    var body = items.map(function (it, i) {
      var f = it.fit;
      return '<xdr:oneCellAnchor><xdr:from><xdr:col>' + f.col + '</xdr:col><xdr:colOff>' + f.colOff +
        '</xdr:colOff><xdr:row>' + f.row + '</xdr:row><xdr:rowOff>' + f.rowOff + '</xdr:rowOff></xdr:from>' +
        '<xdr:ext cx="' + f.cx + '" cy="' + f.cy + '"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="' + (i + 2) +
        '" name="写真 No.' + it.no + '" descr="' + esc(it.caption) + '"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>' +
        '<xdr:blipFill><a:blip r:embed="rId' + (i + 1) + '"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>' +
        '<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + f.cx + '" cy="' + f.cy + '"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr>' +
        '</xdr:pic><xdr:clientData/></xdr:oneCellAnchor>';
    }).join('');
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' + body + '</xdr:wsDr>';
  }

  var REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships/';
  function rels(list) {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      list.map(function (r) { return '<Relationship Id="' + r[0] + '" Type="' + REL + r[1] + '" Target="' + r[2] + '"/>'; }).join('') + '</Relationships>';
  }

  function validate(report) {
    var errs = [];
    if (wrapLines(report.content, LINE_CAP).length > CONTENT_ROWS.length) errs.push('作業内容は' + CONTENT_ROWS.length + '行までです（現在 ' + wrapLines(report.content, LINE_CAP).length + ' 行）');
    if (wrapNotes(report.notes).length > NOTE_ROWS.length) errs.push('特記事項は' + NOTE_ROWS.length + '行までです（現在 ' + wrapNotes(report.notes).length + ' 行）');
    return errs;
  }

  /**
   * @param JSZip   JSZip コンストラクタ
   * @param tplB64  テンプレート（base64）
   * @param report  {sales, site, address, work, date:'YYYY-MM-DD', leader, content, photoNote, notes}
   * @param photos  [{data: Uint8Array(JPEG), w, h, caption}]
   * @returns Promise<Uint8Array>
   */
  async function build(JSZip, tplB64, report, photos) {
    var errs = validate(report);
    if (errs.length) throw new Error(errs.join('\n'));
    var zip = await JSZip.loadAsync(tplB64, { base64: true });
    var photoTpl = await zip.file('tpl/photo.xml').async('string');
    var wbTpl = await zip.file('tpl/workbook.xml').async('string');
    var ctTpl = await zip.file('[Content_Types].xml').async('string');
    var core = await zip.file('docProps/core.xml').async('string');
    zip.remove('tpl');

    // ---- 表紙
    var s1 = await zip.file('xl/worksheets/sheet1.xml').async('string');
    s1 = setCell(s1, 'AQ16', report.sales);
    s1 = setCell(s1, 'R18', report.site);
    s1 = setCell(s1, 'R19', report.address);
    s1 = setCell(s1, 'R20', report.work);
    s1 = setCell(s1, 'R21', dateSerial(report.date), 'num');
    s1 = setCell(s1, 'R22', report.leader);

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var FIELDS = ['site', 'address', 'work', 'date', 'leader', 'sales', 'content', 'photoNote', 'notes'];
  var CHIPS = ['現地全景', '作業前', '作業中', '作業後', '新品', '旧品'];
  var MAX_SIDE = 1600, JPEG_Q = 0.85;

  function today() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
  function blankReport(keep) {
    return { site: '', address: '', work: '', date: today(), leader: keep ? keep.leader : '', sales: keep ? keep.sales : '',
             content: '', photoNote: '別紙参照', notes: '' };
  }
  var state = { report: blankReport(), photos: [] }; // photo: {id, buf, w, h, caption, url}

  /* ---------- 端末内の下書き保存（IndexedDB） ---------- */
  var idb = null;
  function openDb() {
    return new Promise(function (res) {
      try {
        var rq = indexedDB.open('sagyo-houkoku', 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore('kv'); };
        rq.onsuccess = function () { res(rq.result); };
        rq.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
  }
  function dbGet(key) {
    return new Promise(function (res) {
      if (!idb) return res(null);
      try { var rq = idb.transaction('kv').objectStore('kv').get(key); rq.onsuccess = function () { res(rq.result || null); }; rq.onerror = function () { res(null); }; }
      catch (e) { res(null); }
    });
  }
  function dbPut(key, val) {
    return new Promise(function (res) {
      if (!idb) return res(false);
      try { var tx = idb.transaction('kv', 'readwrite'); tx.objectStore('kv').put(val, key); tx.oncomplete = function () { res(true); }; tx.onerror = function () { res(false); }; }
      catch (e) { res(false); }
    });
  }
  var saveTimer = null;
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async function () {
      var ok = await dbPut('draft', {
        report: state.report,
        photos: state.photos.map(function (p) { return { id: p.id, buf: p.buf, w: p.w, h: p.h, caption: p.caption }; })
      });
      $('saved').textContent = ok ? '下書き保存済み' : '';
    }, 400);
  }

  /* ---------- 画像の読み込み・縮小 ---------- */
  function loadImage(blob) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(blob), img = new Image();
      img.onload = function () { res({ img: img, url: url }); };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('画像を読み込めませんでした')); };
      img.src = url; // iOS Safari は撮影時の向き（EXIF）を自動で反映して描画する
    });
  }
  function canvasToBuf(cv) {
    return new Promise(function (res, rej) {
      cv.toBlob(function (b) {
        if (!b) return rej(new Error('画像の変換に失敗しました'));
        b.arrayBuffer().then(res, rej);
      }, 'image/jpeg', JPEG_Q);
    });
  }
  async function processFile(file, rotate) {
    var li = await loadImage(file);
    var w = li.img.naturalWidth, h = li.img.naturalHeight;
    var s = Math.min(1, MAX_SIDE / Math.max(w, h));
    var dw = Math.round(w * s), dh = Math.round(h * s);
    var cv = document.createElement('canvas');
    var rot = rotate ? 1 : 0;
    cv.width = rot ? dh : dw; cv.height = rot ? dw : dh;
    var cx = cv.getContext('2d');
    cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
    if (rot) { cx.translate(dh, 0); cx.rotate(Math.PI / 2); }
    cx.drawImage(li.img, 0, 0, dw, dh);
    URL.revokeObjectURL(li.url);
    var buf = await canvasToBuf(cv);
    var out = { buf: buf, w: cv.width, h: cv.height };
    cv.width = cv.height = 0; // iOS のメモリ解放
    return out;
  }
  function photoUrl(p) {
    if (!p.url) p.url = URL.createObjectURL(new Blob([p.buf], { type: 'image/jpeg' }));
    return p.url;
  }
  async function addFiles(files) {
    files = Array.from(files || []);
    if (!files.length) return;
    var done = 0, failed = 0;
    for (var i = 0; i < files.length; i++) {
      $('progress').textContent = '写真を取り込み中 ' + (i + 1) + ' / ' + files.length;
      try {
        var r = await processFile(files[i]);
        state.photos.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), buf: r.buf, w: r.w, h: r.h, caption: '' });
        done++;
      } catch (e) { failed++; }
    }
    $('progress').textContent = done + '枚追加しました' + (failed ? '（' + failed + '枚は読み込めませんでした）' : '');
    renderPhotos(); scheduleSave();
  }

  /* ---------- 画面描画 ---------- */
  function lineCount(kind) {
    var r = state.report;
    return kind === 'content' ? ReportCore.wrapLines(r.content, ReportCore.LINE_CAP).length : ReportCore.wrapNotes(r.notes).length;
  }
  function renderMeta() {
    var r = state.report;
    [['b-site', r.site], ['b-work', r.work], ['b-date', r.date ? r.date.replace(/^(\d+)-0?(\d+)-0?(\d+)$/, '$1年$2月$3日') : '']].forEach(function (x) {
      var el = $(x[0]); el.textContent = x[1] || '未入力'; el.classList.toggle('empty', !x[1]);
    });
    var n = state.photos.length, pages = Math.ceil(n / ReportCore.PER_PAGE);
    $('b-photos').textContent = n + '枚';
    $('sum').innerHTML = '<b>写真 ' + n + '枚</b><br>' + (pages ? '表紙＋写真' + pages + 'ページ' : '表紙のみ');
    var mc = lineCount('content'), mn = lineCount('notes');
    $('m-content').textContent = mc + ' / ' + ReportCore.CONTENT_MAX + ' 行';
    $('m-content').classList.toggle('over', mc > ReportCore.CONTENT_MAX);
    $('m-notes').textContent = mn + ' / ' + ReportCore.NOTE_MAX + ' 行';
    $('m-notes').classList.toggle('over', mn > ReportCore.NOTE_MAX);
  }
  var ICON = {
    up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
    down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
    rot: '<path d="M20 11a8 8 0 1 1-2.3-5.7L20 7.5"/><path d="M20 3v4.5h-4.5"/>',
    del: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'
  };
  function icon(n) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[n] + '</svg>'; }
  function renderPhotos() {
    var root = $('pages'); root.innerHTML = '';
    var n = state.photos.length;
    if (!n) {
      root.innerHTML = '<div class="empty">まだ写真がありません。<br>1枚目は物件名称が分かる現地写真にしてください。</div>';
      renderMeta(); return;
    }
    var page;
    state.photos.forEach(function (p, i) {
      if (i % ReportCore.PER_PAGE === 0) {
        page = document.createElement('div'); page.className = 'page';
        var pg = i / ReportCore.PER_PAGE + 1;
        page.innerHTML = '<div class="page-label">その' + pg + '（No.' + (i + 1) + (Math.min(n, i + ReportCore.PER_PAGE) > i + 1 ? '〜' + Math.min(n, i + ReportCore.PER_PAGE) : '') + '）</div>';
        root.appendChild(page);
      }
      var card = document.createElement('div'); card.className = 'photo';
      card.innerHTML =
        '<div class="frame"><span class="no">No.' + (i + 1) + '</span><img alt="写真 No.' + (i + 1) + '"></div>' +
        '<div class="body">' +
        '<textarea rows="2" maxlength="180" aria-label="No.' + (i + 1) + ' のコメント" placeholder="コメント（例：作業前）"></textarea>' +
        (i === 0 ? '<p class="first-hint">1枚目は物件名称が分かる現地写真にしてください。</p>' : '') +
        '<div class="chips"></div>' +
        '<div class="tools">' +
        '<button class="tool" data-a="up" type="button" aria-label="前へ移動"' + (i === 0 ? ' disabled' : '') + '>' + icon('up') + '</button>' +
        '<button class="tool" data-a="down" type="button" aria-label="後ろへ移動"' + (i === n - 1 ? ' disabled' : '') + '>' + icon('down') + '</button>' +
        '<button class="tool" data-a="rot" type="button" aria-label="右に90度回転">' + icon('rot') + '回転</button>' +
        '<button class="tool del" data-a="del" type="button" aria-label="写真を削除">' + icon('del') + '削除</button>' +
        '</div></div>';
      card.querySelector('img').src = photoUrl(p);
      var ta = card.querySelector('textarea'); ta.value = p.caption;
      var chips = card.querySelector('.chips');
      function syncChips() { chips.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', String(p.caption === c.textContent)); }); }
      CHIPS.forEach(function (c) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = c;
        b.onclick = function () { p.caption = (p.caption === c) ? '' : c; ta.value = p.caption; syncChips(); scheduleSave(); };
        chips.appendChild(b);
      });
      syncChips();
      ta.addEventListener('input', function () { p.caption = ta.value; syncChips(); scheduleSave(); });
      card.querySelector('.tools').addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        act(b.dataset.a, i, b);
      });
      page.appendChild(card);
    });
    renderMeta();
  }
  async function act(a, i, btn) {
    var ps = state.photos;
    if (a === 'up' && i > 0) { var t = ps[i - 1]; ps[i - 1] = ps[i]; ps[i] = t; }
    else if (a === 'down' && i < ps.length - 1) { var u = ps[i + 1]; ps[i + 1] = ps[i]; ps[i] = u; }
    else if (a === 'del') {
      if (!confirm('No.' + (i + 1) + ' の写真を削除しますか？')) return;
      if (ps[i].url) URL.revokeObjectURL(ps[i].url);
      ps.splice(i, 1);
    }
    else if (a === 'rot') {
      btn.disabled = true;
      try {
        var r = await processFile(new Blob([ps[i].buf], { type: 'image/jpeg' }), true);
        if (ps[i].url) URL.revokeObjectURL(ps[i].url);
        ps[i].buf = r.buf; ps[i].w = r.w; ps[i].h = r.h; ps[i].url = null;
      } catch (e) { alert(e.message); }
    }
    renderPhotos(); scheduleSave();
  }

  function bindFields() {
    FIELDS.forEach(function (f) {
      var el = $(f); el.value = state.report[f] || '';
      el.addEventListener('input', function () { state.report[f] = el.value; renderMeta(); scheduleSave(); $('errors').textContent = ''; });
    });
  }
  function fillFields() { FIELDS.forEach(function (f) { $(f).value = state.report[f] || ''; }); }

  /* ---------- Excel 作成と受け渡し ---------- */
  var downloads = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then(function (d) { downloads = d; }, function () {});
    }
  } catch (e) {}
  var lastFile = null;
  function fileName() {
    var r = state.report;
    var name = '作業報告書_' + (r.date || '').replace(/-/g, '') + '_' + (r.site || '');
    return name.replace(/[\\/:*?"<>|\u0000-\u001f]/g, '').replace(/\s+/g, ' ').replace(/_$/, '').slice(0, 80) + '.xlsx';
  }
  async function makeExcel() {
    var r = state.report, errs = [];
    if (!r.site.trim()) errs.push('現場名称を入力してください');
    if (!r.work.trim()) errs.push('作業名を入力してください');
    if (!r.date) errs.push('作業実施日を入力してください');
    errs = errs.concat(ReportCore.validate(r));
    if (typeof JSZip === 'undefined') errs.push('Excel作成部品を読み込めていません。電波の良い場所でページを再読み込みしてください');
    if (errs.length) { $('errors').textContent = errs.join('\n'); return; }
    var btn = $('make'); btn.disabled = true; btn.textContent = '作成中…';
    try {
      var bytes = await ReportCore.build(JSZip, TEMPLATE_B64, r, state.photos.map(function (p) {
        return { data: new Uint8Array(p.buf), w: p.w, h: p.h, caption: p.caption };
      }));
      var name = fileName();
      lastFile = { name: name, blob: new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }) };
      openSheet();
    } catch (e) {
      $('errors').textContent = 'Excelを作成できませんでした：' + e.message;
    } finally { btn.disabled = false; btn.textContent = 'Excelを作成'; }
  }
  function canShareFile() {
    try {
      return !!(navigator.canShare && navigator.canShare({ files: [new File([lastFile.blob], lastFile.name, { type: lastFile.blob.type })] }));
    } catch (e) { return false; }
  }
  function openSheet() {
    var kb = Math.round(lastFile.blob.size / 1024);
    $('sheetFile').textContent = lastFile.name + '（' + (kb > 1024 ? (kb / 1024).toFixed(1) + ' MB' : kb + ' KB') + '）';
    $('sheetMsg').textContent = '';
    var inClaude = !!downloads, share = !inClaude && canShareFile();
    $('btnSave').hidden = !inClaude;
    $('btnShare').hidden = !share;
    $('btnDownload').hidden = inClaude;
    $('btnDownload').className = share ? 'ghost' : 'primary';
    $('sheetBg').classList.add('open');
    ($('btnSave').hidden ? ($('btnShare').hidden ? $('btnDownload') : $('btnShare')) : $('btnSave')).focus();
  }
  function closeSheet() { $('sheetBg').classList.remove('open'); $('make').focus(); }
  $('btnClose').onclick = closeSheet;
  $('sheetBg').addEventListener('click', function (e) { if (e.target === $('sheetBg')) closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('sheetBg').classList.contains('open')) closeSheet(); });
  $('btnSave').onclick = async function () {
    try {
      await downloads.save({ filename: lastFile.name, data: lastFile.blob });
      $('sheetMsg').textContent = '保存しました';
    } catch (e) {
      var c = e && e.code;
      $('sheetMsg').textContent = c === 'declined' ? '保存をキャンセルしました' : c === 'rate_limited' ? '少し待ってからもう一度押してください' : '保存できませんでした（' + (c || 'error') + '）';
    }
  };
  $('btnShare').onclick = async function () {
    try {
      await navigator.share({ files: [new File([lastFile.blob], lastFile.name, { type: lastFile.blob.type })], title: lastFile.name });
      $('sheetMsg').textContent = '共有しました';
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      $('sheetMsg').textContent = '共有できませんでした。「ダウンロード」をお試しください';
      $('btnDownload').hidden = false;
    }
  };
  $('btnDownload').onclick = function () {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(lastFile.blob); a.download = lastFile.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 60000);
    $('sheetMsg').textContent = 'ダウンロードを開始しました（「ファイル」アプリのダウンロードに保存されます）';
  };

  $('make').onclick = makeExcel;
  $('cam').addEventListener('change', function (e) { addFiles(e.target.files).then(function () { e.target.value = ''; }); });
  $('lib').addEventListener('change', function (e) { addFiles(e.target.files).then(function () { e.target.value = ''; }); });
  $('reset').onclick = function () {
    if (!confirm('入力内容と写真をすべて消して、新しい報告書を始めますか？\n（作業責任者名と営業担当者は残します）')) return;
    state.photos.forEach(function (p) { if (p.url) URL.revokeObjectURL(p.url); });
    state = { report: blankReport(state.report), photos: [] };
    fillFields(); renderPhotos(); scheduleSave(); $('progress').textContent = ''; $('errors').textContent = '';
    window.scrollTo(0, 0);
  };

  /* ---------- 起動 ---------- */
  bindFields(); renderPhotos();
  openDb().then(async function (db) {
    idb = db;
    var d = await dbGet('draft');
    if (d && d.report) {
      state.report = Object.assign(blankReport(), d.report);
      state.photos = (d.photos || []).filter(function (p) { return p && p.buf; });
      fillFields(); renderPhotos();
      $('saved').textContent = '下書きを復元しました';
    }
  });
})();
</script>
</body>
</html>
